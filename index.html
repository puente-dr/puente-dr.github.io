<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Puente guides</title>
<meta name="description" content="Public guides for Puente coordinators and administrators.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23161616'/><text x='16' y='23' font-family='system-ui' font-size='19' font-weight='700' fill='%23ffe680' text-anchor='middle'>P</text></svg>">
<style>
  :root{
    --ink:#161616; --paper:#f7f7f7; --surface:#ffffff;
    --muted:#6e6e6e; --line:#d4d4d4;
    --action:#3d80fc; --action-deep:#0a46b6; --mark:#ffe680;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 var(--sans);}
  .wrap{max-width:40rem;margin:0 auto;padding:0 1.25rem}
  header.top{background:var(--ink);color:#fff;padding:3.5rem 0 3rem}
  .brand{display:flex;align-items:center;gap:.6rem;margin-bottom:2rem}
  .mark{width:34px;height:34px;border-radius:9px;background:var(--mark);color:var(--ink);
        display:grid;place-items:center;font-weight:700;font-size:1.05rem}
  header.top h1{margin:0 0 .6rem;font-size:clamp(1.9rem,5vw,2.7rem);line-height:1.12;letter-spacing:-.02em}
  header.top p{margin:0;color:#c9c9c9;font-size:1.075rem}
  main{padding:2.5rem 0 4rem}
  a.card{display:block;background:var(--surface);border:1px solid var(--line);border-radius:8px;
         padding:1.25rem 1.4rem;color:inherit;text-decoration:none}
  a.card:hover,a.card:focus-visible{border-color:var(--action)}
  a.card h2{margin:0 0 .35rem;font-size:1.15rem;color:var(--action-deep)}
  a.card p{margin:0;color:var(--muted)}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand"><div class="mark">P</div><span>Puente</span></div>
    <h1>Guides</h1>
    <p>Public documentation for coordinators and administrators.</p>
  </div>
</header>
<main>
  <div class="wrap">
    <a class="card" href="how-to-create-and-manage-orgs/">
      <h2>How to create and manage organizations</h2>
      <p>How an organization is created in Puente, and how to look after one: nicknames, approvals, retiring and merging.</p>
    </a>
  </div>
</main>
</body>
</html>
